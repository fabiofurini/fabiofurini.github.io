bio:
  - >-
    I am an Associate Professor of Operations Research at the Department of
    Computer, Control and Management Engineering "Antonio Ruberti" (DIAG),
    Sapienza University of Rome. My research is on exact algorithms for hard
    combinatorial optimization problems: mixed-integer linear programming,
    decomposition and reformulation techniques, and combinatorial
    branch-and-bound, with a consistent focus on solving to proven optimality
    instances that were previously out of reach.
  - >-
    Before joining Sapienza in 2021, I was Maître de conférences at LAMSADE,
    Université Paris Dauphine-PSL (2013–2019), where I obtained the
    Habilitation à diriger des recherches in 2017, and a postdoctoral fellow
    at LIPN, Université Paris 13, and at the University of Bologna. I received
    my Ph.D. from the University of Bologna in 2011, under the supervision of
    Paolo Toth and Alberto Caprara. I hold the national qualification as Full
    Professor in Italy, France and Denmark.
  - >-
    I am Associate Editor of Omega, and Program Committee Chair and local
    organizer of the European Mixed Integer Programming Workshop (EUROMIP)
    2026 in Rome.

interests:
  - Mixed-integer linear programming
  - Decomposition and reformulation
  - Combinatorial branch-and-bound
  - Cutting and packing
  - Graph optimization
  - Bilevel and interdiction problems

