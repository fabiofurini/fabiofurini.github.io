intro: "Il mio materiale didattico è organizzato in una collana di 13 corsi con la stessa impostazione: dispense online e in PDF, esercizi con le soluzioni, laboratorio interattivo e quiz di autovalutazione, in italiano e in inglese, liberamente accessibili. Alla Sapienza, il corso di laurea magistrale Programmazione intera e ottimizzazione combinatoria (Ingegneria gestionale, dal 2021) usa Programmazione lineare intera, Problemi di ottimizzazione combinatoria, Programmazione dinamica, Algoritmi euristici, Algoritmi di approssimazione e Modellazione MIP."
