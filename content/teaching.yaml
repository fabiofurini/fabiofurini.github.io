tools_intro: Interactive tools I use and build for teaching.
tools:
- name: Bomberino
  summary: 'An interactive workbench for operations research algorithms: primal and dual simplex, Gomory
    cutting planes and branch-and-bound on small linear and integer programs. Every pivot, bound, cut
    and branching step is recorded in exact fractions, and the worked exercise exports to LaTeX.'
  url: https://fciccarelli.com/bomberino
  note: Built with Fabio Ciccarelli
