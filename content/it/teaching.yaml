intro:
- "Insegno ricerca operativa, ottimizzazione e matematica alla Sapienza Università di Roma, dove dal 2021 tengo il corso magistrale Programmazione intera e ottimizzazione combinatoria in Ingegneria gestionale e il corso di Analisi matematica 1."
- "Dal 2013 al 2019, all'Université Paris Dauphine-PSL, ho insegnato in francese e in inglese: ottimizzazione lineare e combinatoria, ottimizzazione per la scienza dei dati e per la finanza, gestione della produzione, logistica umanitaria e basi di dati. In precedenza ho insegnato nelle università di Parma e di Modena e Reggio Emilia. Ho tenuto inoltre corsi di dottorato e scuole a Bologna, Lille, Parigi e per il CIMPA."
- "Il mio materiale didattico è una collana di 14 corsi, dalla matematica e dagli algoritmi all'ottimizzazione e alla modellazione, in italiano e in inglese e liberamente accessibile."
groups:
- name: "Matematica"
  courses:
  - name: "Analisi Matematica 1"
    detail: "Analisi matematica di una variabile reale, dai fondamenti agli integrali. Il corso parte da logica, tecniche di dimostrazione, insiemi e insiemi numerici, poi tratta funzioni, successioni e limiti, continuità, derivate e studio di funzione, serie e integrali, con grafici interattivi per i risultati principali."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz"]
    sites:
    - label: "Analisi Matematica 1"
      lang: IT
      url: https://fabiofurini.github.io/analisi-matematica-1/
      repo: https://github.com/fabiofurini/analisi-matematica-1
    - label: "Mathematical Analysis 1"
      lang: EN
      url: https://fabiofurini.github.io/mathematical-analysis-1/
      repo: https://github.com/fabiofurini/mathematical-analysis-1
  - name: "Algebra lineare"
    detail: "L'algebra lineare che serve per l'ottimizzazione. Sommatorie e produttorie, vettori e matrici, operazioni sulle matrici, inversione, fattorizzazione LU, autovalori e autovettori, norme e sistemi lineari risolti con l'eliminazione di Gauss. Un laboratorio di calcolo mostra tutti i passaggi dei metodi in frazioni esatte."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz"]
    sites:
    - label: "Algebra lineare"
      lang: IT
      url: https://fabiofurini.github.io/algebra-lineare/
      repo: https://github.com/fabiofurini/algebra-lineare
    - label: "Linear Algebra"
      lang: EN
      url: https://fabiofurini.github.io/linear-algebra/
      repo: https://github.com/fabiofurini/linear-algebra
- name: "Algoritmi"
  courses:
  - name: "Algoritmi"
    detail: "Un'introduzione agli algoritmi e alla loro analisi. Rappresentazione dei numeri, pseudocodice, ordinamento, ricerca e algoritmi numerici; la loro implementazione in C++, Python e Java; notazione asintotica, tempo di esecuzione, correttezza, ricorsione ed equazioni di ricorrenza fino al Master theorem."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz", "Notebook Colab"]
    sites:
    - label: "Algoritmi"
      lang: IT
      url: https://fabiofurini.github.io/algoritmi/
      repo: https://github.com/fabiofurini/algoritmi
    - label: "Algorithms"
      lang: EN
      url: https://fabiofurini.github.io/algorithms/
      repo: https://github.com/fabiofurini/algorithms
- name: "Ottimizzazione lineare e convessa"
  courses:
  - name: "Programmazione lineare"
    detail: "La teoria e gli algoritmi della programmazione lineare. Poliedri e problemi di programmazione lineare con i loro esiti possibili, l'algoritmo del simplesso con la fase 0, la teoria della dualità e il simplesso duale, il simplesso rivisto, il metodo primale-duale, l'analisi di sensitività e la geometria della programmazione lineare."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz", "Notebook Colab"]
    sites:
    - label: "Programmazione lineare"
      lang: IT
      url: https://fabiofurini.github.io/programmazione-lineare/
      repo: https://github.com/fabiofurini/programmazione-lineare
    - label: "Linear Programming"
      lang: EN
      url: https://fabiofurini.github.io/linear-programming/
      repo: https://github.com/fabiofurini/linear-programming
  - name: "Ottimizzazione su reti"
    detail: "I problemi di ottimizzazione su grafi e reti e gli algoritmi che li risolvono. Alberi ricoprenti di costo minimo, cammini minimi, flusso massimo, flusso di costo minimo, problemi di trasporto e di assegnamento, il simplesso su reti e la gestione dei progetti con il cammino critico."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz"]
    sites:
    - label: "Ottimizzazione su reti"
      lang: IT
      url: https://fabiofurini.github.io/ottimizzazione-su-reti/
      repo: https://github.com/fabiofurini/ottimizzazione-su-reti
    - label: "Network Optimization"
      lang: EN
      url: https://fabiofurini.github.io/network-optimization/
      repo: https://github.com/fabiofurini/network-optimization
  - name: "Ottimizzazione convessa"
    notice: In costruzione
    detail: "Le basi matematiche dell'ottimizzazione non lineare. Insiemi convessi, funzioni di più variabili, funzioni convesse e quadratiche con le loro caratterizzazioni, problemi di ottimizzazione convessi e concavi e le proprietà delle loro soluzioni ottime."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz"]
    sites:
    - label: "Ottimizzazione convessa"
      lang: IT
      url: https://fabiofurini.github.io/ottimizzazione-convessa/
      repo: https://github.com/fabiofurini/ottimizzazione-convessa
    - label: "Convex Optimization"
      lang: EN
      url: https://fabiofurini.github.io/convex-optimization/
      repo: https://github.com/fabiofurini/convex-optimization
- name: "Programmazione intera e ottimizzazione combinatoria"
  note: "Questi corsi, con Modellazione MIP, formano il corso magistrale della Sapienza Programmazione intera e ottimizzazione combinatoria."
  courses:
  - name: "Programmazione lineare intera"
    detail: "La programmazione lineare intera e mista e i metodi esatti per risolverla. Il rilassamento lineare e i bound, le disuguaglianze valide e i piani di taglio, gli algoritmi di branch-and-bound e branch-and-cut, il funzionamento dei solver MIP e le euristiche che usano."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz"]
    sites:
    - label: "Programmazione lineare intera"
      lang: IT
      url: https://fabiofurini.github.io/programmazione-lineare-intera/
      repo: https://github.com/fabiofurini/programmazione-lineare-intera
    - label: "Integer Linear Programming"
      lang: EN
      url: https://fabiofurini.github.io/integer-linear-programming/
      repo: https://github.com/fabiofurini/integer-linear-programming
  - name: "Problemi di ottimizzazione combinatoria"
    detail: "I problemi classici di ottimizzazione combinatoria, uno per uno. Zaino, bin packing, colorazione, clique, routing, scheduling e lot sizing: le definizioni, le formulazioni di programmazione intera con le loro proprietà e i bound, e gli algoritmi ad hoc per ciascun problema."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz"]
    sites:
    - label: "Problemi di ottimizzazione combinatoria"
      lang: IT
      url: https://fabiofurini.github.io/ottimizzazione-combinatoria/
      repo: https://github.com/fabiofurini/ottimizzazione-combinatoria
    - label: "Combinatorial Optimization Problems"
      lang: EN
      url: https://fabiofurini.github.io/combinatorial-optimization/
      repo: https://github.com/fabiofurini/combinatorial-optimization
  - name: "Programmazione dinamica"
    detail: "La programmazione dinamica come metodo esatto per i problemi combinatori. I principi del metodo, ricorrenze, pseudocodice e complessità degli algoritmi di PD per la famiglia dello zaino (0/1, illimitato, limitato, subset sum, a scelta multipla, multidimensionale, con setup), il lot sizing, il cambio monete e il taglio delle aste."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz"]
    sites:
    - label: "Programmazione dinamica"
      lang: IT
      url: https://fabiofurini.github.io/programmazione-dinamica/
      repo: https://github.com/fabiofurini/programmazione-dinamica
    - label: "Dynamic Programming"
      lang: EN
      url: https://fabiofurini.github.io/dynamic-programming/
      repo: https://github.com/fabiofurini/dynamic-programming
  - name: "Algoritmi euristici"
    detail: "Gli algoritmi euristici per i problemi difficili di ottimizzazione combinatoria. Bound primali e duali e valutazione di un'euristica, euristiche costruttive, ricerca locale, metaeuristiche ed euristiche MIP, applicate a problemi di zaino, packing, routing, scheduling e colorazione, con notebook Colab."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz", "Notebook Colab"]
    sites:
    - label: "Algoritmi euristici"
      lang: IT
      url: https://fabiofurini.github.io/algoritmi-euristici/
      repo: https://github.com/fabiofurini/algoritmi-euristici
    - label: "Heuristic Algorithms"
      lang: EN
      url: https://fabiofurini.github.io/heuristic-algorithms/
      repo: https://github.com/fabiofurini/heuristic-algorithms
  - name: "Algoritmi di approssimazione"
    detail: "Gli algoritmi con una garanzia dimostrata sulla qualità delle soluzioni. Analisi del caso peggiore e istanze tight per lo zaino, il bin packing, il TSP metrico e lo scheduling su macchine parallele, gli schemi di approssimazione e i limiti dell'approssimazione per la colorazione dei vertici, la clique massima e il TSP generale."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz", "Notebook Colab"]
    sites:
    - label: "Algoritmi di approssimazione"
      lang: IT
      url: https://fabiofurini.github.io/algoritmi-di-approssimazione/
      repo: https://github.com/fabiofurini/algoritmi-di-approssimazione
    - label: "Approximation Algorithms"
      lang: EN
      url: https://fabiofurini.github.io/approximation-algorithms/
      repo: https://github.com/fabiofurini/approximation-algorithms
- name: "Modellazione"
  courses:
  - name: "Modellazione PL"
    detail: "Dalla descrizione di un problema di decisione al modello di programmazione lineare risolto con Python e Gurobi. Tecniche di modellazione, il solver e l'interpretazione della soluzione, e casi di studio: produzione e scorte, ricarica di veicoli elettrici, Data Envelopment Analysis, newsvendor, VaR e CVaR, arbitraggio e regressione robusta."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz", "Notebook Colab"]
    sites:
    - label: "Modellazione PL"
      lang: IT
      url: https://fabiofurini.github.io/modellazione-pl/
      repo: https://github.com/fabiofurini/modellazione-pl
    - label: "LP Modelling"
      lang: EN
      url: https://fabiofurini.github.io/lp-modelling/
      repo: https://github.com/fabiofurini/lp-modelling
  - name: "Modellazione MIP"
    detail: "Modelli di programmazione lineare intera per problemi di decisione reali, implementati in Python e Gurobi. Che cos'è un modello MIP, rilassamenti e bound, logica con le variabili binarie e legami fra variabili, euristiche costruttive, e modelli di assegnamento, scheduling, localizzazione, copertura e pianificazione della produzione."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz", "Notebook Colab"]
    sites:
    - label: "Modellazione MIP"
      lang: IT
      url: https://fabiofurini.github.io/modellazione-mip/
      repo: https://github.com/fabiofurini/modellazione-mip
    - label: "MIP Modelling"
      lang: EN
      url: https://fabiofurini.github.io/mip-modelling/
      repo: https://github.com/fabiofurini/mip-modelling
  - name: "Modellazione PNL"
    notice: In costruzione
    detail: "Modelli di programmazione non lineare risolti con Python e Gurobi. Richiami di teoria e solver per i modelli non lineari, e casi di studio: produzione con smoothing quadratico, supply chain e CO2, portafoglio di Markowitz, pricing, budget pubblicitario, localizzazione continua, code, support vector machine e minimi quadrati."
    material: ["Dispense in PDF", "Esempi svolti", "Esercizi", "Slide", "App interattive", "Quiz", "Notebook Colab"]
    sites:
    - label: "Modellazione PNL"
      lang: IT
      url: https://fabiofurini.github.io/modellazione-pnl/
      repo: https://github.com/fabiofurini/modellazione-pnl
    - label: "NLP Modelling"
      lang: EN
      url: https://fabiofurini.github.io/nlp-modelling/
      repo: https://github.com/fabiofurini/nlp-modelling
