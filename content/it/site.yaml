tagline: >-
  Algoritmi esatti per l'ottimizzazione combinatoria — programmazione intera,
  decomposizione e riformulazione, applicati a problemi di packing, colorazione,
  clique, interdizione e localizzazione.

bio:
  - >-
    Sono professore associato di Ricerca Operativa al Dipartimento di Ingegneria
    Informatica, Automatica e Gestionale "Antonio Ruberti" (DIAG) della Sapienza
    Università di Roma. Mi occupo di algoritmi esatti per problemi difficili di
    ottimizzazione combinatoria: programmazione lineare intera mista, tecniche di
    decomposizione e riformulazione, branch-and-bound combinatorio. Il filo
    conduttore è risolvere all'ottimo garantito istanze che prima non erano alla
    portata.
  - >-
    Prima di arrivare alla Sapienza nel 2021 sono stato maître de conférences al
    LAMSADE dell'Université Paris Dauphine-PSL (2013–2019), dove nel 2017 ho
    conseguito l'Habilitation à diriger des recherches, e assegnista al LIPN
    dell'Université Paris 13 e all'Università di Bologna. Il dottorato l'ho preso
    a Bologna nel 2011, con Paolo Toth e Alberto Caprara. Ho l'abilitazione a
    professore ordinario in Italia, Francia e Danimarca.
  - >-
    Sono Associate Editor di Omega e presiedo il comitato di programma di EUROMIP
    2026, il convegno europeo di programmazione intera, che organizzo a Roma.

interests:
  - Programmazione lineare intera mista
  - Decomposizione e riformulazione
  - Branch-and-bound combinatorio
  - Cutting e packing
  - Ottimizzazione su grafi
  - Problemi bilivello e di interdizione

