tools_intro: Strumenti interattivi che uso e sviluppo per la didattica.
tools:
- name: Bomberino
  summary: 'Un banco di lavoro interattivo per gli algoritmi della ricerca operativa: simplesso primale
    e duale, tagli di Gomory e branch-and-bound su piccoli problemi lineari e interi. Ogni pivot, bound,
    taglio e ramificazione resta tracciato in frazioni esatte, e l''esercizio svolto si esporta in LaTeX.'
  url: https://fciccarelli.com/bomberino
  note: Realizzato con Fabio Ciccarelli
