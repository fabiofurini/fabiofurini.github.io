research_title: Algoritmi esatti per problemi combinatori difficili
research_lead: >-
  Il mio lavoro costruisce formulazioni matematiche e algoritmi esatti —
  branch-and-price, branch-and-cut, decomposizione di Benders e di Dantzig-Wolfe,
