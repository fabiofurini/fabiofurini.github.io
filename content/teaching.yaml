intro: "My teaching material is organised as a series of 13 courses built the same way: lecture notes online and in PDF, exercises with solutions, an interactive lab and self-assessment quizzes, in English and Italian, openly accessible. At Sapienza, the master's course Integer Programming and Combinatorial Optimization (Management Engineering, since 2021) uses Integer Linear Programming, Combinatorial Optimization Problems, Dynamic Programming, Heuristic Algorithms, Approximation Algorithms and MIP Modelling."
